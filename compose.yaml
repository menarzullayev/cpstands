# The cpstands stack. The HTTP endpoints listen on 127.0.0.1 only.
# Production:   docker compose up -d --build   (migrations, then the bot) against the hosted
#               database in CPSTANDS_DATABASE_URL (Supabase, see docs/runbooks/database-backup.md).
# Development:  docker compose --profile dev up -d db   (PostgreSQL for tests, 127.0.0.1:5440)
#   CPSTANDS_ENV_FILE points at the secrets file (default ./.env); GIT_SHA labels the build.
name: cpstands

services:
  db:
    # Development and tests only; production uses the hosted database.
    profiles: ["dev"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpstands
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpstands}
      POSTGRES_DB: cpstands
    ports:
      - "127.0.0.1:${CPSTANDS_DB_PORT:-5440}:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpstands -d cpstands"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: &build
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: cpstands:latest
    command: ["migrate"]
    restart: "no"
    env_file: ${CPSTANDS_ENV_FILE:-.env}
    environment:
      # Required: the hosted database (set in .env). There is no silent fallback.
      DATABASE_URL: ${CPSTANDS_DATABASE_URL:?set CPSTANDS_DATABASE_URL in .env}

  bot:
    build: *build
    image: cpstands:latest
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: ${CPSTANDS_ENV_FILE:-.env}
    environment:
      # Required: the hosted database (set in .env). There is no silent fallback.
      DATABASE_URL: ${CPSTANDS_DATABASE_URL:?set CPSTANDS_DATABASE_URL in .env}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${CPSTANDS_HTTP_PORT:-9180}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata-dev:
