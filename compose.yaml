# The cpstands stack. The database and the HTTP endpoints listen on 127.0.0.1 only.
# Development:  docker compose up -d db        (PostgreSQL for development and tests)
# Production:   docker compose up -d --build   (database, migrations, then the bot)
#   CPSTANDS_ENV_FILE points at the secrets file (default ./.env); GIT_SHA labels the build.
name: cpstands

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cpstands
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cpstands}
      POSTGRES_DB: cpstands
    ports:
      - "127.0.0.1:${CPSTANDS_DB_PORT:-5440}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cpstands -d cpstands"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: &build
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: cpstands:latest
    command: ["migrate"]
    restart: "no"
    env_file: ${CPSTANDS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://cpstands:${POSTGRES_PASSWORD:-cpstands}@db:5432/cpstands
    depends_on:
      db:
        condition: service_healthy

  bot:
    build: *build
    image: cpstands:latest
    command: ["run"]
    restart: unless-stopped
    stop_grace_period: 20s
    env_file: ${CPSTANDS_ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+asyncpg://cpstands:${POSTGRES_PASSWORD:-cpstands}@db:5432/cpstands
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      GIT_SHA: ${GIT_SHA:-unknown}
    ports:
      - "127.0.0.1:${CPSTANDS_HTTP_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
