[project]
name = "cpstands"
version = "0.1.0"
description = "Live competitive-programming contest tracker for Telegram"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Saidakbar Narzullayev", email = "192264739+menarzullayev@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.31.0",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fluent-runtime>=0.4.0",
    "httpx>=0.28.1",
    "ijson>=3.6.0",
    "pydantic-settings>=2.16.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[project.scripts]
cpstands = "cpstands.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "S", "ASYNC", "RUF", "PT", "T20", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608", "S311", "E501"]
"migrations/**" = ["E501"]
"scripts/**" = ["T201", "S310", "E501", "E731"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "migrations"]

[[tool.mypy.overrides]]
module = ["ijson", "ijson.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["db: tests that need a PostgreSQL database (TEST_DATABASE_URL)"]
