# Continuous integration. Runs only on GitHub-hosted runners (never on the self-hosted deploy runner, ADR-015).
# Third-party actions are pinned to commit SHAs; the version is in the trailing comment.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cpstands
          POSTGRES_PASSWORD: cpstands
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpstands"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://cpstands:cpstands@127.0.0.1:5432/postgres
      REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest -q

  miniapp:
    name: Mini App (types, size, behaviour, contrast, visuals)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The same image renders the visual baselines locally (npm run test:visual:docker).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble@sha256:6e3fb709361521eb27161606e6da6d2674e5e89fa16516cb37d6fdd91372273d
      options: --ipc=host
    defaults:
      run:
        working-directory: miniapp
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -b
      - run: npm run build
      - run: npm run budget
      - run: npm run test:budget
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: miniapp/playwright-report
          retention-days: 7

  security:
    name: Dependency audit and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - name: pip-audit
        run: uv run pip-audit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Documentation validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      # Pinned to a framework commit. Only "validate" runs here: "audit" rewrites project state.
      - name: Project Alpha validate
        run: >-
          uvx --from git+https://github.com/menarzullayev/project-alpha.git@aa1b169985f0e34bcc6295cd4fe1c963a2565e01
          project-alpha validate
      # `docker run` without --rm (stateful image) or `docker rm` without -v leaves an anonymous
      # volume that nothing owns. Scans scripts, workflows and the commands in the runbooks.
      - name: Docker volume leaks (docker run without --rm, docker rm without -v)
        run: |
          python3 scripts/check_docker_run.py --selftest
          python3 scripts/check_docker_run.py

  image:
    name: Container image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: cpstands:ci
      - name: Smoke test
        run: |
          docker run --rm cpstands:ci version
          test "$(docker run --rm --entrypoint id cpstands:ci -u)" = "10001"
          docker run --rm --entrypoint sh cpstands:ci -c 'test ! -e /app/.env'
